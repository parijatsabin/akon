# Supabase local development configuration.
# `npx supabase start` reads this. Hosted-project settings live in the
# dashboard; keep the auth section here in sync with it.

project_id = "akon"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
# Per-file ceiling. The `media` bucket sets its own 2 MB limit in 0011.
file_size_limit = "5MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# CMS accounts are created by a superadmin, never self-served.
enable_signup = false

[auth.email]
enable_signup = false
# Logins use a synthetic <username>@auth.anok.local address that receives no
# mail, so there is nothing to confirm. See MIGRATION.md §2 decision 1.
enable_confirmations = false
double_confirm_changes = false

[edge_runtime]
enabled = true
policy = "oneshot"

[functions.admin-create-user]
# The caller's JWT is verified inside the function so it can return a clean
# 403 for a non-superadmin rather than an opaque gateway error.
verify_jwt = false
